<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Veterinaria Patitas Felices</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/productos.css">
</head>
<body>

    <!--Menú de navegación-->
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand" href="../index.html">Patitas Felices</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link active" href="productos.html">Productos</a></li>
                    <li class="nav-item">
                        <a class="nav-link" href="#carrito">Carrito
                            <span class="badge bg-light text-dark" id="contador_carrito">0</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">

        <h2>Nuestros productos</h2>
        <p>Busca por nombre o elige una categoría.</p>

        <!--Buscador y categorías-->
        <div class="row mb-4">
            <div class="col-12 col-md-8 mb-2">
                <input type="text" id="buscador" class="form-control" placeholder="Buscar producto..." onkeyup="filtrarProductos()">
            </div>
            <div class="col-12 col-md-4 mb-2">
                <select id="categoria" class="form-select" onchange="filtrarProductos()">
                    <option value="Todas">Todas las categorías</option>
                    <option value="Alimento">Alimento</option>
                    <option value="Juguetes">Juguetes</option>
                    <option value="Higiene">Higiene</option>
                    <option value="Medicina">Medicina</option>
                    <option value="Accesorios">Accesorios</option>
                </select>
            </div>
        </div>

        <div class="row">

            <!--Lista de productos-->
            <div class="col-12 col-lg-8">
                <div class="row" id="lista_productos">
                </div>
            </div>

            <!--Carrito de compras-->
            <div class="col-12 col-lg-4" id="carrito">
                <div class="card">
                    <div class="card-header bg-success text-white">Mi carrito</div>
                    <ul class="list-group list-group-flush" id="lista_carrito">
                    </ul>
                    <div class="card-body">
                        <p class="fw-bold">Total: <span id="total_carrito">$0.00</span></p>
                        <button class="btn btn-outline-danger" onclick="vaciarCarrito()">Vaciar carrito</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/productos.js"></script>
</body>
</html>
